name: AnTuras
options:
  bundleIdPrefix: ie.anturas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AnTuras:
    type: application
    platform: iOS
    sources:
      - path: AnTuras
      # Style-branch contact sheets for `--art` debug only (symlink → ../art/exploration).
      - path: art-exploration
        type: folder
    info:
      path: AnTuras/Info.plist
      properties:
        CFBundleDisplayName: An Turas
        CFBundleURLTypes:
          - CFBundleURLName: ie.anturas.personal-atlas
            CFBundleURLSchemes:
              - anturas
        NSMicrophoneUsageDescription: "An Turas records your voice only so you can hear yourself beside the model line. Recordings never leave this device."
        NSLocationWhenInUseUsageDescription: "An Turas uses a coarse, one-time location only after you ask for nearby Irish place-names. It is not retained."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QCVP3CNMP6
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: libsqlite3.tbd
  AnTurasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnTurasTests
      - path: AnTuras/Resources/personal-atlas-subjects.json
        buildPhase: resources
    dependencies:
      - target: AnTuras
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
  AnTurasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AnTurasUITests
    dependencies:
      - target: AnTuras
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
