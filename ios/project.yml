name: AnTuras
options:
  bundleIdPrefix: ie.anturas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AnTuras:
    type: application
    platform: iOS
    sources:
      - path: AnTuras
        excludes:
          - AnTuras/Resources/art
      - path: AnTuras/Resources/art
        type: folder
      - path: art-exploration
        type: folder
    info:
      path: AnTuras/Info.plist
      properties:
        CFBundleDisplayName: An Turas
        NSMicrophoneUsageDescription: "An Turas records your voice only so you can hear yourself beside the model line. Recordings never leave this device."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

